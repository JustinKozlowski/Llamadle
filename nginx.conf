server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html/llamadle;
    index index.html index.html;

    location /llamadle {
        alias /usr/share/nginx/html/llamadle;
        index index.html;
        try_files $uri /index.html;
    }

    # llamadle-api shares this container's network namespace (see docker-compose.yml),
    # so it's reachable over plain localhost.
    location /llamadle/daily {
        proxy_pass http://localhost:3000/daily;
    }
    location /llamadle/count-tokens {
        proxy_pass http://localhost:3000/count-tokens;
    }
}